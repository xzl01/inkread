name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Data layer unit tests
        run: ./gradlew --no-daemon :core-data:testDebugUnitTest

      - name: Pagination unit tests
        run: ./gradlew --no-daemon :feature-reader:testDebugUnitTest

      - name: End-to-end UI smoke test (Robolectric)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: inkread-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
