name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # GitHub runner 自带 Android SDK；这里只补齐本项目需要的 components。
      # 注意：不要用 android-actions/setup-android@v3 —— 它会安装已从 SDK 仓库移除的
      # legacy "tools" 包，导致 "Failed to find package 'tools'" 失败。
      - name: Prepare Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "未找到预装 Android SDK（ANDROID_SDK_ROOT/ANDROID_HOME 为空）" >&2
            exit 1
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -path '*/cmdline-tools/*' | sort | tail -n 1)"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Data layer unit tests
        run: ./gradlew --no-daemon :core-data:testDebugUnitTest

      - name: Pagination unit tests
        run: ./gradlew --no-daemon :feature-reader:testDebugUnitTest

      - name: End-to-end UI smoke test (Robolectric)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: inkread-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
